plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mint.toolbox'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mint.toolbox'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '1.4'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // 按 ABI 拆包：armeabi-v7a / arm64-v8a / x86 / x86_64 各一个，另出一个全架构合并包
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
}
